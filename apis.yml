aid: channable
name: Channable
description: >-
  Channable is a feed management and marketplace integration platform that helps online retailers,
  brands, and agencies optimize, distribute, and advertise their product data across more than 2,500
  marketing channels, price comparison sites, affiliate networks, and online marketplaces. Beyond feed
  optimization and PPC ad automation, Channable operates an order-connection layer that synchronizes
  orders, shipments, stock, and returns between marketplaces and a seller's ERP, WMS, or e-commerce
  platform. The Channable order connection API (v1) exposes this layer programmatically: retailers and
  platform integrators can retrieve orders and returns, post shipment and cancellation updates, push
  stock/offer updates to every connected marketplace at once, upload order attachments, resolve
  standardized transporter codes, and pull order statistics. Authentication is a company-level bearer
  token, requests are rate limited per company with a leaky-bucket policy, and a Channable Sandbox
  connection lets integrators test order flows without touching live marketplaces.
