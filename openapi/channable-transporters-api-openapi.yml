    ChannelTransportersForUnifiedTransporter:
      properties:
        channels:
          additionalProperties:
            items:
              $ref: '#/components/schemas/ReducedChannelTransporter'
            type: array
          propertyNames:
            $ref: '#/components/schemas/ChannelName'
          type: object
          title: Channels
      type: object
      required:
      - channels
      title: ChannelTransportersForUnifiedTransporter
      example:
        channels:
          amazon:
          - country: ALL
            label: DPD Classic
          bol:
          - country: ALL
            label: DPD Pakketshop Nederland
          - country: BE
            label: DPD Pakketshop België
          cdiscount:
          - country: ALL
            label: DPD
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ReducedChannelTransporter:
      properties:
        country:
          $ref: '#/components/schemas/Country'
        label:
          type: string
          title: Label
      type: object
      required:
      - country
      - label
      title: ReducedChannelTransporter
      description: 'Model that only contains some information about the channel transporter. This is useful when

        customers request channel transporters for a given unified transporter.'
      example:
        country: NL
        label: Post NL
    UnifiedTransporter:
      properties:
        transporter_code:
          type: string
          title: Transporter Code
        transporter_label:
          type: string
          title: Transporter Label
      type: object
      required:
