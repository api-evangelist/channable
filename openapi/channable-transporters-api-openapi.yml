openapi: 3.2.0
info:
  title: Channable order connection Transporters API
  description: '# Introduction


    Welcome to the Channable API __v1__.'
  version: v1
  x-logo:
    url: https://www.channable.com/_next/image?url=https%3A%2F%2Fmedia.graphassets.com%2FcntRnbAcSrCmS1wLTWrb&w=256&q=75
tags:
- name: transporters
paths:
  /v1/transporters/all:
    get:
      tags:
      - transporters
      summary: All Transporters
      description: Returns the code and label of all Channable transporters.
      operationId: all_transporters_transporters_all_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedTransporters'
  /v1/transporters/transporter/{transporter_code}:
    get:
      tags:
      - transporters
      summary: Channels For Transporter
      description: Returns the marketplace specific transporters that match the `transporter_code` url parameter.
      operationId: channels_for_transporter_transporters_transporter__transporter_code__get
      parameters:
      - name: transporter_code
        in: path
        required: true
        schema:
          type: string
          title: Transporter Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelTransportersForUnifiedTransporter'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/transporters/channel/{channel}:
    get:
      tags:
      - transporters
      summary: Transporters For Channel
      description: Returns a list of transporters which are supported by a specific channel.
      operationId: transporters_for_channel_transporters_channel__channel__get
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ChannelName'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelTransportersForChannel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
