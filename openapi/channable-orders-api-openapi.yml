      properties:
        order_item_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Order Item Ids
          description: Channable order item ids that are part of a partial cancellation. If you want to cancel all order items of the order, you can set this field to `null` or provide all order item ids. If you want to cancel some of the order items of the order you can provide the item ids of the ones that you are willing to cancel. The status of the order will then change to `partial`. Once you cancel more of the order items, you can repeat the request using the new order item ids that you want to cancel.
