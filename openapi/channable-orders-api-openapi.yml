openapi: 3.2.0
info:
  title: Channable order connection Orders API
  description: '# Introduction


    Welcome to the Channable API __v1__.'
  version: v1
  x-logo:
    url: https://www.channable.com/_next/image?url=https%3A%2F%2Fmedia.graphassets.com%2FcntRnbAcSrCmS1wLTWrb&w=256&q=75
tags:
- name: Orders
paths:
  /v1/companies/{company_id}/projects/{project_id}/orders:
    get:
      tags:
      - Orders
      summary: All Orders
      description: 'This operation is deprecated.

        Use All orders v2 instead.


        This endpoint retrieves all orders for a given project of your company, sorted from most recent

        to oldest. Optionally, you can pass query parameters to customize the response content.


        Note that the order data itself (like address information) can not be modified.


        **Timezones**


        When using the `start_date`, `end_date`, `last_modified_after`, `last_modified_before`,

        `retrieved_at_start` or `retrieved_at_end` parameters please keep in mind that the we will

        interpret the provided dates and times to be in UTC timezone.


        The timestamps on the returned orders are ISO 8601 compliant and have a UTC offset of +00:00.


        **Example usage**


        Suppose the following scenario for a given project of yours:

        - The project contains the orders `o1`, `o2`, `o3`, and `o4` (from oldest to most recent)

        - `o3` contains some error

        - `o1` and `o4` are searchable by the term `t`

        - `o3` is searchable by the term `tE`


        | Request parameters | Response

        | ------------- | -----------

        | _none_ | `{"orders": [o4, o3, o2, o1], "error_count": 1, "total": 4}`

        | `?errors=true` | `{"orders": [o3], "error_count": 1, "total": 1}`

        | `?limit=2` | `{"orders": [o4, o3], "error_count": 1, "total": 2}`

        | `?offset=1` | `{"orders": [o3, o2, o1], "error_count": 1, "total": 3}`

        | `?offset=4` | `{"orders": [], "error_count": 1, "total": 0}`

        | `?offset=1&limit=1` | `{"orders": [o3], "error_count": 1, "total": 1}`

        | `?offset=1&limit=2` | `{"orders": [o3, o2], "error_count": 1, "total": 2}`

        | `?offset=1&limit=2&errors=true` | `{"orders": [o3], "error_count": 1, "total": 1}`

        | `?search=t` | `{"orders": [o4, o1], "error_count": 0, "total": 2}`

        | `?search=t&errors=true` | `{"orders": [], "error_count": 1, "total": 0}`

        | `?search=tE` | `{"orders": [o3], "error_count": 1, "total": 1}`

        | `?search=tE&errors=true` | `{"orders": [o3], "error_count": 1, "total": 1}`

        | `?offset=1&limit=2&search=t&errors=true` | `{"orders": [], "error_count": 1, "total": 0}`

        | `?status=not_shipped` | `{"orders": [o4], "error_count": 1, "total": 1}`

        | `?start_date=2018-01-01` | `{"orders": [o4, o3, o2], "error_count": 1, "total": 3}`

        | `?start_date=2018-01-01&end_date=2018-02-28` | `{"orders": [o3, o2], "error_count": 1, "total": 2}`

        | `?last_modified_after=2018-02-29` | `{"orders": [o4], "error_count": 1, "total": 1}`'
      operationId: all_orders_companies__company_id__projects__project_id__orders_get
      deprecated: true
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: integer
          title: Company Id
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          description: If true, a file download will be served
          default: false
          title: Download
        description: If true, a file download will be served
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrderStatus'
          - type: array
            items:
              $ref: '#/components/schemas/OrderStatus'
          - type: 'null'
          title: Status
      - name: channel
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Channel
      - name: errors
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Errors
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Any text based search query
          title: Search
        description: Any text based search query
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: string
            format: date-time
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: string
            format: date-time
          - type: 'null'
          title: End Date
      - name: retrieved_at_start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: string
            format: date-time
          - type: 'null'
          title: Retrieved At Start
      - name: retrieved_at_end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: string
            format: date-time
          - type: 'null'
          title: Retrieved At End
      - name: last_modified_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: string
            format: date-time
          - type: 'null'
          title: Last Modified After
      - name: last_modified_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: string
            format: date-time
          - type: 'null'
          title: Last Modified Before
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max number of results in a single page.
          default: 100
          title: Limit
        description: Max number of results in a single page.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Filter results starting from this offset.
          default: 0
          title: Offset
        description: Filter results starting from this offset.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentOrders'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
