notes: >-
  As of 2026-08-13 Channable does not ship an official client library on npm, PyPI, Packagist, NuGet,
  RubyGems, Maven Central, crates.io, or pkg.go.dev. Integrators call the REST API directly with a
  bearer token. No `type: SDKs` pointer is emitted because no first-party (official) SDK exists.
  Decay signal: the two general-purpose community PHP clients last released in 2023, before the v2
  order endpoints that now supersede the deprecated v1 order reads — an integrator adopting either
  gets a client that cannot reach the current surface.
