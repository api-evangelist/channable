format: channable-error-envelope
envelope:
  description: >-
    Non-validation errors return the standard Channable error envelope (schema ChannableErrorResponse):
    a JSON object with `status` (always "error") and `message` (human-readable description). Note the
    401 Unauthorized response uses an `error` field instead of `message`. HTTP 422 validation errors use
    a different shape (HTTPValidationError) with a `detail[]` array of field-level ValidationError items
    (loc/msg/type). This API does not use RFC 9457 application/problem+json.
  content_type: application/json
  fields:
    status: const "error"
    message: human-readable error description (ChannableErrorResponse)
    error: used in place of message on 401 responses
    detail: array of {loc, msg, type} on 422 validation errors (HTTPValidationError)
problems:
- status: 400
  title: Bad Request
  meaning: The request was malformed or contained invalid parameters/payload.
  seen_on: [shipment, cancel, stock_updates, offers, returns/test]
- status: 401
