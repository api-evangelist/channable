summary: >-
  Channable serves NO /.well-known/ discovery document on any host. api.channable.com and
  helpcenter.channable.com answer 404 for every path; docs.channable.com answers 404 with an HTML
  shell; www.channable.com answers 429 with a "Vercel Security Checkpoint" interstitial for every
  automated request; and app.channable.com answers 200 with the single-page-app HTML shell for
  EVERY /.well-known/* path — a catch-all, not a document. No WellKnown or SecurityTxt pointer is
  emitted in apis.yml, because the probe records an absence, not a presence.
  The one real machine-readable discovery document Channable does publish is
  https://helpcenter.channable.com/llms.txt (200, text/markdown, 124 KB, 678 lines) — a GitBook
  llms.txt indexing the whole help center; it is captured verbatim in llms/channable-llms.txt.
