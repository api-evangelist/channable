note: >-
  Channable's marketing pricing page (https://www.channable.com/pricing) is served behind a Vercel
  Security Checkpoint and answers 429 to automated requests, so the tiers below were read from
  Channable's own GitBook help center, which publishes the same subscription model as markdown.
  A Channable subscription = package (item/project/channel volume) + Core plan (Standard | Plus | Pro)
  + optional modules and add-ons. Channable does NOT publish a list price for the packages or the
  Core plans in public documentation; the only public per-unit prices are the CSS plans and the
  order-sync add-on, which are recorded verbatim below. Nothing is estimated or invented.
model: package + plan + modules
currencies:
- EUR
- USD
billing_period: monthly
billing_notes: >-
  Invoiced in advance on the 20th of each month for the following month. Upgrades/downgrades and
  cancellations must be made before the 20th. No setup fees. Unlimited users on every plan.
  Payment methods: direct debit (EU), credit card (outside EU), invoice (EU, subscriptions EUR 500+).
  Exceeding the package usage limit triggers an automatic subscription upgrade.
